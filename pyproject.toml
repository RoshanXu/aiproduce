[project]
name = "aiproduce"
version = "0.1.0"
description = "商用级小说改剧本多智能体系统"
readme = "Readme.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "traesolo" }]

dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "chromadb>=0.5.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "tiktoken>=0.7.0",
    "jinja2>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "gradio>=5.0.0",
]

[project.scripts]
aiproduce = "src.cli.main:cli"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }
packages = ["src", "src.models", "src.db", "src.store", "src.agents", "src.workflow", "src.cli", "src.utils", "src.web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
